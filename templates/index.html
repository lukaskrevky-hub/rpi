<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistivní Hub</title>
    
    <!-- === EXTERNÍ KNIHOVNY (CDN) === -->
    <!-- Bootstrap 5: CSS framework pro responzivní mřížku (grid) a základní UI komponenty -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6: Vektorové ikony používané na kartách a v horní liště -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- === KASKÁDOVÉ STYLY (CSS) === -->
    <style>
        /* Základní definice vzhledu (Dark Mode pro menší namáhání očí pacienta) */
        body { 
            background-color: #121212; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            overflow-x: hidden; /* Zamezení horizontálnímu posuvníku */
        }
        
        /* Styl jednotlivých položek menu (Karet) */
        .card { 
            transition: all 0.2s ease-in-out; /* Plynulé animace při najetí/výběru */
            cursor: pointer; 
            border: 2px solid #333; 
            background-color: #1e1e1e; 
            border-radius: 15px; 
            min-height: 180px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
        }
        
        /* Třída pro kartu, která je aktuálně vybrána (zvýrazněna) joystickem */
        .joystick-active { 
            border-color: #00ff00 !important; 
            transform: scale(1.05); /* Mírné zvětšení aktivní karty */
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4); 
            background-color: #2a2a2a; 
            z-index: 10;
        }

        /* Vizuální zpětná vazba: Animace (probliknutí) při potvrzení akce */
        @keyframes flashConfirm {
            0% { background-color: #2a2a2a; transform: scale(1.05); }
            50% { background-color: #198754; transform: scale(1.15); box-shadow: 0 0 40px #198754; }
            100% { background-color: #2a2a2a; transform: scale(1.05); }
        }
        .flash-animation {
            animation: flashConfirm 0.4s ease-out;
        }
        
        .icon-large { font-size: 3.5rem; margin-bottom: 15px; display: block; }
        
        /* Horní informační panel (připevněný k hornímu okraji) */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: #000; border-bottom: 1px solid #333;
            margin-bottom: 20px; position: sticky; top: 0; z-index: 1000;
        }
        
        /* Stylování indikátoru stavu připojení joysticku */
        .msg-container { display: flex; align-items: center; gap: 15px; }
        .status-badge {
            font-size: 1rem; padding: 6px 15px; border-radius: 50px; font-weight: bold;
            display: flex; align-items: center; gap: 8px; text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .status-ready { background-color: #198754; color: white; border: 1px solid #198754; }
        .status-sleep { background-color: #212529; color: #6c757d; border: 1px solid #495057; }
        .status-conn { background-color: #ffc107; color: black; border: 1px solid #ffc107; }
        
        /* Tlačítko pro vyřízení požadavku (určeno pro ošetřovatele) */
        .reset-btn {
            background-color: #dc3545; color: white; border: none;
            padding: 5px 15px; border-radius: 5px; font-weight: bold;
            display: none; cursor: pointer; animation: pulse 2s infinite;
        }
        .reset-btn:hover { background-color: #bb2d3b; }
        
        /* Pulzující animace upozorňující na nevyřízený požadavek */
        @keyframes pulse {
            0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); }
        }
        
        .mode-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 2px; }
    </style>
</head>
<body>
    <!-- === HORNÍ INFORMAČNÍ PANEL === -->
    <div class="top-bar">
        <div>
            <!-- Indikátor aktuální úrovně v menu (např. Hlavní obrazovka, TV, Rádio) -->
            <div id="mode-display" class="mode-label">NAČÍTÁM...</div>

            <div class="msg-container">
                <!-- Dynamický textový výstup zpráv od pacienta -->
                <div id="status-message" style="font-size: 1.4rem; font-weight: bold;">Čekám na data...</div>
                <!-- Tlačítko pro storno zprávy pečovatelem (odesílá API dotaz /api/reset) -->
                <button id="reset-button" class="reset-btn" onclick="resetMsg()">
                    <i class="fa-solid fa-check"></i> VYŘÍZENO
                </button>
            </div>
        </div>
        <!-- Vizuální ukazatel stavu BLE spojení mezi malinou a joystickem -->
        <div id="connection-indicator" class="status-badge status-sleep">
            <i class="fa-solid fa-moon"></i> <span>SPÍ</span>
        </div>
    </div>

    <!-- === HLAVNÍ OBSAH - DYNAMICKÁ MŘÍŽKA KARET === -->
    <div class="container">
        <!-- Zde JavaScript dynamicky vykreslí komponenty menu (Karty) pomocí dat z backendu. -->
        <div id="menu-container" class="row justify-content-center g-4"></div>
    </div>

    <!-- === APLIKAČNÍ LOGIKA (JavaScript) === -->
    <script>
        // --- GLOBÁLNÍ STAVOVÉ PROMĚNNÉ FRONTENDU ---
        let lastMenuStr = "";       // Slouží k detekci změny ve struktuře menu (zabraňuje zbytečnému překreslování DOMu)
        let lastActionTime = 0;     // Ukládá časové razítko poslední akce pro řízení "flash" animace

        /**
         * Hlavní asynchronní smyčka (Polling).
         * Pravidelně dotazuje Flask backend (API) na aktuální stav systému.
         */
        function updateStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    
                    // --- 1. ZPRACOVÁNÍ ZMĚNY STRUKTURY MENU ---
                    // Převedení pole objektů (menu) na JSON řetězec umožňuje rychlé porovnání stavů.
                    const currentMenuStr = JSON.stringify(data.current_menu);
                    if (currentMenuStr !== lastMenuStr) {
                        // Překreslení pouze při skutečné změně dat (např. přechod do podmenu)
                        renderMenu(data.current_menu);
                        lastMenuStr = currentMenuStr;
                        
                        const modeLabel = document.getElementById('mode-display');
                        
                        // Detekce hloubky zanoření ve stromovém menu. 
                        // Pokud není prázdná historie, nacházíme se v podmenu ovladačů.
                        if (data.menu_history && data.menu_history.length > 0) {
                            modeLabel.innerText = "OVLÁDÁNÍ ZAŘÍZENÍ";
                            modeLabel.style.color = "#0dcaf0"; 
                        } else {
                            modeLabel.innerText = "BĚŽNÉ POŽADAVKY";
                            modeLabel.style.color = "#888"; 
                        }
                    }

                    // --- 2. VIZUALIZACE KURZORU (Výběru) ---
                    // Přiřazení třídy 'joystick-active' prvku odpovídajícímu aktuálnímu indexu.
                    document.querySelectorAll('.card').forEach((c, idx) => {
                        if (idx === data.selected_index) {
                            c.classList.add('joystick-active');
                        } else {
                            c.classList.remove('joystick-active');
                        }
                    });

                    // --- 3. SPOUŠTĚNÍ ANIMACÍ (Haptická/Vizuální odezva) ---
                    // Pokud je časové razítko poslední akce z backendu novější, přehraje se animace potvrzení.
                    if (data.last_action && data.last_action > lastActionTime) {
                        lastActionTime = data.last_action;
                        const activeCard = document.querySelector('.joystick-active');
                        if (activeCard) {
                            // Tzv. "CSS reflow hack" umožňující restartovat CSS animaci na stejném elementu.
                            activeCard.classList.remove('flash-animation');
                            void activeCard.offsetWidth; // Spustí synchronní překreslení DOMu
                            activeCard.classList.add('flash-animation');
                        }
                    }

                    // --- 4. AKTUALIZACE STAVOVÉ LIŠTY ---
                    updateHeader(data);
                })
                .catch(err => console.error("Chyba synchronizace s backendem:", err));
        }

        /**
         * Dynamicky generuje HTML strukturu položek menu (Karet) na základě JSON dat.
         * Používá ES6 Template Literals pro přehlednou konstrukci HTML kódu.
         * * @param {Array} menuItems - Pole slovníků obsahujících konfiguraci jednotlivých karet.
         */
        function renderMenu(menuItems) {
            const container = document.getElementById('menu-container');
            container.innerHTML = ""; // Vyčištění stávajícího kontejneru

            menuItems.forEach((item, index) => {
                const html = `
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="card h-100 text-center p-4 text-white" onclick="manualClick(${index})">
                        <div class="card-body">
                            <i class="fa-solid ${item.icon} icon-large text-${item.color}"></i>
                            <h4 class="card-title mt-3">${item.label}</h4>
                        </div>
                    </div>
                </div>`;
                container.innerHTML += html; // Připojení nově vygenerované karty k DOMu
            });
        }

        /**
         * Zajišťuje logiku zobrazování stavových hlášek, upozornění pro ošetřovatele a stavu připojení.
         * * @param {Object} data - Kompletní stavový objekt načtený z backendu.
         */
        function updateHeader(data) {
            const msgBox = document.getElementById('status-message');
            const resetBtn = document.getElementById('reset-button');
            msgBox.innerText = data.message;
            
            // Filtrace zpráv: Rozlišení mezi informativní zprávou (navigace) a poplachem (např. žádost o pití).
            const isInfoMessage = data.message.startsWith("Menu:") || 
                                  data.message.startsWith("TV:") || 
                                  data.message.startsWith("KLÍMA:") || 
                                  data.message.startsWith("RÁDIO:") || 
                                  data.message.startsWith("LED:") || 
                                  data.message === "Jste v hlavním menu";
            
            // Logika spuštění poplachu (tlačítko "Vyřízeno" se zobrazí pouze u reálných požadavků).
            if (data.message !== "Připraveno" && !isInfoMessage) {
                msgBox.style.color = "#ffc107"; // Žlutá výstražná barva
                resetBtn.style.display = "block";
            } else {
                msgBox.style.color = "white";
                resetBtn.style.display = "none";
            }

            // Aktualizace indikátoru připojení (Přepínání CSS tříd a FontAwesome ikon).
            const badge = document.getElementById('connection-indicator');
            const icon = badge.querySelector('i');
            const text = badge.querySelector('span');
            
            badge.classList.remove('status-ready', 'status-sleep', 'status-conn');

            if (data.connection === 'READY') {
                badge.classList.add('status-ready');
                icon.className = 'fa-solid fa-gamepad';
                text.innerText = "AKTIVNÍ";
            } else if (data.connection === 'CONNECTING') {
                badge.classList.add('status-conn');
                icon.className = 'fa-solid fa-spinner fa-spin';
                text.innerText = "PŘIPOJOVÁNÍ";
            } else {
                badge.classList.add('status-sleep');
                icon.className = 'fa-solid fa-moon';
                text.innerText = "SPÍ";
            }
        }

        // --- MANUÁLNÍ OVLÁDÁNÍ PŘES UI ---
        // Umožňuje ovládání systému i pečovatelem pomocí dotykové obrazovky / myši, bez nutnosti použití joysticku.
        
        // Simuluje stisk karty pacienta (odesílá index karty na API)
        function manualClick(id) { fetch('/api/click/' + id, { method: 'POST' }); }
        
        // Resetuje aktivní poplach odesláním požadavku na příslušný API endpoint
        function resetMsg() { fetch('/api/reset', { method: 'POST' }); }

        // --- START APLIKACE ---
        // Inicializace hlavní programové smyčky. Polling frekvence nastavena na 300 ms pro optimální plynulost uživatelského rozhraní.
        setInterval(updateStatus, 300);
    </script>
</body>
</html>
