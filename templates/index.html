<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Asistivní Hub</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/static/style.css">
    <meta name="google" content="notranslate">
</head>

<body>
    <div class="top-bar">
        
        <div>
            <div id="mode-display" class="mode-label">NAČÍTÁM...</div>
            
            <div class="msg-container">
                <div id="status-message" style="font-size: 1.4rem; font-weight: bold;">Čekám na data...</div>
                
                <button id="reset-button" class="reset-btn" onclick="resetMsg()">
                    <i class="fa-solid fa-check"></i> VYŘÍZENO
                </button>
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end;">
            
            <button id="tts-button" class="btn btn-outline-info btn-sm" onclick="toggleTts()" style="border-radius: 50px; padding: 6px 15px; font-weight: bold; box-shadow: 0 0 10px rgba(0,0,0,0.3);">
                <i class="fa-solid fa-volume-xmark"></i> <span class="d-none d-sm-inline">HLAS: VYP</span>
            </button>
            
            <button class="btn btn-outline-danger btn-sm" onclick="triggerOta()" style="border-radius: 50px; padding: 6px 15px; font-weight: bold; box-shadow: 0 0 10px rgba(0,0,0,0.3);">
                <i class="fa-solid fa-download"></i> <span class="d-none d-sm-inline">AKTUALIZOVAT OVLADAČ</span>
            </button>
            
            <div id="connection-indicator" class="status-badge status-sleep">
                <i class="fa-solid fa-moon"></i> <span>SPÍ</span>
            </div>
        </div>
    </div>

    <div class="container pb-4">
        <div id="menu-container" class="row justify-content-center g-3"></div>
    </div>

    <script>
        // GLOBÁLNÍ PROMĚNNÉ
        // lastMenuStr slouží jako "paměť". Ukládáme si sem aktuální podobu menu. Pokud nám server pošle úplně stejné menu, nebudeme stránku zbytečně překreslovat.
        let lastMenuStr = "";       
        // lastActionTime pamatuje čas poslední odeslané akce. Zabraňuje tomu, aby se animace potvrzení přehrávala pořád dokola.
        let lastActionTime = 0;     

        /**
         * HLAVNÍ FUNKCE SYSTÉMU: updateStatus()
         * Tato funkce funguje jako srdce klienta. Pravidelně se ptá serveru (web.py): "Co je nového?"
         */
        function updateStatus() {
            // Používáme Fetch API pro asynchronní požadavek (AJAX) na naši adresu /api/status.
            // Fígl '?t=...' (Cache Buster) přidává k URL aktuální čas v milisekundách. Tím oklameme prohlížeč, aby si myslel, že jde o unikátní dotaz, a nestahoval stará data z paměti.
            fetch('/api/status?t=' + new Date().getTime())
                .then(response => response.json()) // Jakmile server odpoví, převedeme jeho odpověď do formátu JSON (JavaScriptový objekt)
                .then(data => {
                    // KROK 1: Kontrola a vykreslení menu
                    // Převedeme přijaté pole tlačítek (current_menu) na obyčejný textový řetězec, aby šlo snadno porovnat s tím, co už máme vykreslené.
                    const currentMenuStr = JSON.stringify(data.current_menu);
                    
                    // Pokud se přijaté menu liší od toho, které vidíme na obrazovce (uživatel např. přepnul z TV na LED pásek)...
                    if (currentMenuStr !== lastMenuStr) {
                        // ...zavoláme funkci renderMenu, která celou obrazovku překreslí novými tlačítky
                        renderMenu(data.current_menu);
                        // Uložíme si novou podobu menu do paměti pro příští kontrolu
                        lastMenuStr = currentMenuStr;
                        
                        // Změna nadpisu nahoře vlevo. Zjišťujeme, kde v systému jsme:
                        const modeLabel = document.getElementById('mode-display');
                        // Pokud je historie menu delší než 0, znamená to, že jsme se zanořili hlouběji (např. do ovládání konkrétní TV)
                        if (data.menu_history && data.menu_history.length > 0) {
                            modeLabel.innerText = "OVLÁDÁNÍ ZAŘÍZENÍ - PODMENU";
                            modeLabel.style.color = "#0dcaf0"; // Azurová barva pro podmenu
                        } else {
                            // Pokud nejsme zanoření, jsme v hlavním kořenovém menu. Rozlišujeme, zda jsme v sekci elektroniky nebo požadavků
                            if (data.mode === "devices") {
                                modeLabel.innerText = "VÝBĚR ZAŘÍZENÍ";
                                modeLabel.style.color = "#0dcaf0"; 
                            } else {
                                modeLabel.innerText = "BĚŽNÉ POŽADAVKY";
                                modeLabel.style.color = "#888"; // Šedá barva pro kořenové menu požadavků
                            }
                        }
                    }

                    // KROK 2: Vizuální kurzor pro pacienta (zvýraznění vybraného tlačítka)
                    // Najdeme všechny nakreslené karty (tlačítka) na stránce
                    document.querySelectorAll('.card').forEach((c, idx) => {
                        // Pokud se pořadové číslo karty (idx) shoduje s číslem (selected_index), které nám poslal systém z joysticku...
                        if (idx === data.selected_index) {
                            // ...přidáme kartě CSS třídu 'joystick-active', která vytvoří zelený rámeček a kartu zvětší.
                            c.classList.add('joystick-active');
                            // Funkce scrollIntoView zajistí, že pokud je menu moc dlouhé, prohlížeč sám odscrolluje tak, aby pacient na vybranou kartu vždy viděl
                            c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        } else {
                            // Pokud to není aktuálně vybraná karta, zelený rámeček jí odebereme
                            c.classList.remove('joystick-active');
                        }
                    });

                    // KROK 3: Animace úspěšného odeslání povelu (Flash efekt)
                    // Pokud server hlásí novější čas akce, než jaký si pamatujeme...
                    if (data.last_action && data.last_action > lastActionTime) {
                        lastActionTime = data.last_action; // Zapíšeme si nový čas
                        // Najdeme tu kartu, na které pacient zrovna stojí...
                        const activeCard = document.querySelector('.joystick-active');
                        if (activeCard) {
                            // Odebereme starou animaci a "trikem" s offsetWidth přinutíme prohlížeč ji okamžitě znovu přidat. Karta tak krátce blikne zeleně.
                            activeCard.classList.remove('flash-animation');
                            void activeCard.offsetWidth; 
                            activeCard.classList.add('flash-animation');
                        }
                    }

                    // KROK 4: Krizový stav
                    // Pokud Python hlásí, že je aktivní SOS režim (data.sos_active == true), přidáme celému tělu webu třídu, která rozbliká obrazovku do ruda.
                    if (data.sos_active) {
                        document.body.classList.add('sos-blinking');
                    } else {
                        document.body.classList.remove('sos-blinking');
                    }

                    // Na konci celého cyklu aktualizujeme i texty v horní liště
                    updateHeader(data);
                })
                .catch(err => console.error("Fetch Error:", err)); // V případě ztráty spojení se serverem vypíšeme chybu do vývojářské konzole
        }

        /**
         * FUNKCE PRO VYKRESLENÍ TLAČÍTEK (DOM Manipulace)
         * Tato funkce bere čistá data z Pythonu (např. {"label": "TV", "icon": "fa-tv"}) a lepí z nich HTML kód.
         */
        function renderMenu(menuItems) {
            // Najdeme hlavní obal pro tlačítka a celý jeho dosavadní obsah vymažeme (aby se tlačítka neduplikovala)
            const container = document.getElementById('menu-container');
            container.innerHTML = ""; 

            // Responzivní logika (vzhled podle počtu prvků): 
            // Pokud má menu více než 6 položek (typicky detailní ovládání LED pásku s barvami), zapneme "kompaktní režim".
            const isCompact = menuItems.length > 6;
            // Bootstrap třídy: Na telefonu (col-6) 2 sloupce, na tabletu (col-md-4) 3 sloupce, na PC (col-lg-3) 4 sloupce. V kompaktním režimu dáváme ještě více sloupců, aby se jich vešlo víc.
            const colClass = isCompact ? "col-4 col-md-3 col-lg-2" : "col-6 col-md-4 col-lg-3";
            // Přidáme vlastní třídu pro menší výšku karty, pokud je kompaktní režim
            const cardClass = isCompact ? "compact-card" : "";

            // Projdeme pole tlačítek položku po položce...
            menuItems.forEach((item, index) => {
                // Sestavíme textový řetězec, který obsahuje kompletní HTML kód jedné karty.
                // Všimni si, že pomocí ${...} vkládáme do textu proměnné z Pythonu (barvy, ikony, názvy).
                // Atribut onclick volá naši funkci manualClick(), aby šlo na kartu kliknout i myší, nejen joystickem.
                const html = `
                <div class="${colClass}">
                    <div class="card h-100 text-center p-3 text-white ${cardClass}" onclick="manualClick(${index})">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center p-0">
                            <i class="fa-solid ${item.icon} icon-large text-${item.color}"></i>
                            <h4 class="card-title mt-2">${item.label}</h4>
                        </div>
                    </div>
                </div>`;
                // Vytvořený kus HTML kódu přilepíme na konec kontejneru
                container.innerHTML += html; 
            });
        }

        /**
         * FUNKCE PRO AKTUALIZACI HORNÍ LIŠTY (Status Bar)
         */
        function updateHeader(data) {
            // Získáme přístup k HTML elementům zpráv a SOS tlačítka
            const msgBox = document.getElementById('status-message');
            const resetBtn = document.getElementById('reset-button');
            
            // Vypíšeme text, který nám poslal Python (např. "MÁM ŽÍZEŇ")
            msgBox.innerText = data.message;
            
            // LOGIKA ZOBRAZENÍ SOS TLAČÍTKA:
            // Musíme rozlišit, zda jde o pouhou informaci (přepnutí menu, zapnutí TV) - tehdy sestra nic nevyřizuje.
            // Pokud zpráva začíná těmito slovy, bereme ji jako informační.
            const isInfoMessage = data.message.startsWith("Menu:") || 
                                  data.message.startsWith("TV:") || 
                                  data.message.startsWith("KLÍMA:") || 
                                  data.message.startsWith("RÁDIO:") || 
                                  data.message.startsWith("LED:") || 
                                  data.message.startsWith("Režim:") ||
                                  data.message.startsWith("Povel k aktualizaci") ||
                                  data.message === "Jste v hlavním menu" ||
                                  data.message === "Připraveno";
            
            // Pokud zpráva NENÍ informační (tzn. pacient odeslal požadavek typu "POMOC"),
            // text obarvíme na výstražnou žlutou barvu a zviditelníme červené potvrzovací tlačítko.
            if (!isInfoMessage) {
                msgBox.style.color = "#ffc107"; 
                resetBtn.style.display = "block";
            } else {
                // Jinak text zůstane bílý a tlačítko skryjeme
                msgBox.style.color = "white"; 
                resetBtn.style.display = "none";
            }

            // AKTUALIZACE TLAČÍTKA HLASOVÉHO ASISTENTA (TTS)
            const ttsBtn = document.getElementById('tts-button');
            if (ttsBtn) {
                // Pokud nám Python pošle, že je čtení aktivní...
                // (Zachováme skrytý text pro mobily pomocí span d-none)
                if (data.tts_enabled) {
                    ttsBtn.classList.replace('btn-outline-info', 'btn-info'); // Plná modrá barva pro aktivní stav
                    ttsBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i> <span class="d-none d-sm-inline">HLAS: ZAP</span>';
                } else {
                    // Pokud je čtení vypnuté...
                    ttsBtn.classList.replace('btn-info', 'btn-outline-info'); // Pouze obrys pro neaktivní stav
                    ttsBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i> <span class="d-none d-sm-inline">HLAS: VYP</span>';
                }
            }

            // AKTUALIZACE STAVU ESP32 (Odznak nahoře vpravo)
            const badge = document.getElementById('connection-indicator');
            const icon = badge.querySelector('i');
            const text = badge.querySelector('span');
            
            // Nejdřív odstraníme všechny možné stavové barvy z předchozího cyklu
            badge.classList.remove('status-ready', 'status-sleep', 'status-conn');

            // Pokud nám Python hlásí, že je ovladač připojen k webserveru...
            if (data.connection === 'READY') {
                badge.classList.add('status-ready'); // Přidáme zelenou barvu
                icon.className = 'fa-solid fa-gamepad'; // Ikona ovladače
                text.innerText = "AKTIVNÍ";
            } 
            // Pokud se zrovna navazuje spojení...
            else if (data.connection === 'CONNECTING') {
                badge.classList.add('status-conn'); // Přidáme žlutou barvu
                icon.className = 'fa-solid fa-spinner fa-spin'; // Ikona točícího se kolečka
                text.innerText = "PŘIPOJOVÁNÍ";
            } 
            // Pokud je ovladač vypnutý / v režimu spánku...
            else {
                badge.classList.add('status-sleep'); // Přidáme šedou barvu
                icon.className = 'fa-solid fa-moon'; // Ikona měsíčku
                text.innerText = "SPÍ";
            }
        }
        
        // --- API VOLÁNÍ (Odesílání povelů na server) ---
        // Všechny tyto funkce odesílají HTTP POST požadavek na náš Python server. Server pak podle URL adresy pozná, co má udělat.

        // Odešle na server číslo karty, na kterou ošetřovatel ručně klikl myší nebo dotykem na displeji
        function manualClick(id) { fetch('/api/click/' + id, { method: 'POST' }); }
        
        // Odešle na server povel ke zrušení poplachu / smazání zprávy (voláno po kliknutí na červené tlačítko VYŘÍZENO)
        function resetMsg() { fetch('/api/reset', { method: 'POST' }); }
        
        // Odešle na server povel, aby připravil aktualizační balíček (firmware) pro ESP32 ovladač
        function triggerOta() { fetch('/api/ota', { method: 'POST' }); }
        
        // Odešle na server povel pro zapnutí/vypnutí čtení obrazovky (TTS)
        function toggleTts() { fetch('/api/tts_toggle', { method: 'POST' }); }
        
        // --- NEJDŮLEŽITĚJŠÍ ŘÁDEK SYSTÉMU ---
        // Funkce setInterval zajistí, že se naše hlavní smyčka updateStatus() bude spouštět neustále dokola, přesně každých 300 milisekund (cca 3x za vteřinu).
        // Díky tomu webové rozhraní okamžitě reaguje na pohyby joysticku v pacientově ruce, ačkoliv jde přes bezdrátovou síť.
        setInterval(updateStatus, 300);
    </script>
</body>
</html>
