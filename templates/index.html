<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistivní Hub</title>
    
    <!-- ========================================== -->
    <!-- EXTERNÍ KNIHOVNY A FRAMEWORKY (CDN)        -->
    <!-- ========================================== -->
    <!-- Bootstrap 5: CSS framework využívaný pro responzivní mřížku (grid systém) a základní typografii -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6: Knihovna vektorových ikon pro grafickou reprezentaci jednotlivých požadavků a stavů -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ========================================== -->
    <!-- KASKÁDOVÉ STYLY (CSS)                      -->
    <!-- ========================================== -->
    <style>
        /* --- ZÁKLADNÍ VZHLED (Téma) --- */
        /* Zvolen Dark Mode (tmavý režim) pro minimalizaci únavy očí pacienta/uživatele */
        body { 
            background-color: #121212; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            overflow-x: hidden; /* Ochrana proti nechtěnému horizontálnímu posouvání obrazovky */
        }
        
        /* --- STYLOVÁNÍ KARET (Prvky menu) --- */
        .card { 
            transition: all 0.2s ease-in-out; /* Hardwarově akcelerovaná plynulá animace změn */
            cursor: pointer; 
            border: 2px solid #333; 
            background-color: #1e1e1e; 
            border-radius: 15px; 
            min-height: 180px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
        }
        
        /* --- KOMPAKTNÍ REŽIM (Pro menu s mnoha položkami jako TV) --- */
        .compact-card {
            min-height: 120px !important; /* Zlatá střední cesta (původně 180px, minule 120px) */
            padding: 15px !important;
        }
        .compact-card .icon-large {
            font-size: 2.5rem !important; /* Zvětšené ikony pro lepší čitelnost */
            margin-bottom: 8px !important;
        }
        .compact-card .card-title {
            font-size: 1.1rem !important; /* Zvětšené písmo */
            margin-top: 8px !important;
            margin-bottom: 0 !important;
        }
        
        /* Zvýraznění karty, na které se aktuálně nachází kurzor (joystick) */
        .joystick-active { 
            border-color: #00ff00 !important; 
            transform: scale(1.05); /* Vizuální vystoupení karty do popředí */
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4); /* Zelená záře pro jasnou identifikaci */
            background-color: #2a2a2a; 
            z-index: 10;
        }

        /* --- ANIMACE (Vizuální a haptická odezva) --- */
        /* Animace potvrzení - karta při stisku tlačítka "SELECT" problikne zeleně */
        @keyframes flashConfirm {
            0% { background-color: #2a2a2a; transform: scale(1.05); }
            50% { background-color: #198754; transform: scale(1.15); box-shadow: 0 0 40px #198754; }
            100% { background-color: #2a2a2a; transform: scale(1.05); }
        }
        .flash-animation {
            animation: flashConfirm 0.4s ease-out;
        }
        
        .icon-large { font-size: 3.5rem; margin-bottom: 15px; display: block; }
        
        /* --- HORNÍ INFORMAČNÍ PANEL (Stavová lišta) --- */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: #000; border-bottom: 1px solid #333;
            margin-bottom: 20px; 
            position: sticky; top: 0; z-index: 1000; /* Panel zůstává viditelný i při rolování dolů */
        }
        
        .msg-container { display: flex; align-items: center; gap: 15px; }
        
        /* Stylování dynamického indikátoru připojení (Bluetooth/MQTT) */
        .status-badge {
            font-size: 1rem; padding: 6px 15px; border-radius: 50px; font-weight: bold;
            display: flex; align-items: center; gap: 8px; text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .status-ready { background-color: #198754; color: white; border: 1px solid #198754; }
        .status-sleep { background-color: #212529; color: #6c757d; border: 1px solid #495057; }
        .status-conn { background-color: #ffc107; color: black; border: 1px solid #ffc107; }
        
        /* Tlačítko pro vyřízení alarmu ošetřovatelem */
        .reset-btn {
            background-color: #dc3545; color: white; border: none;
            padding: 5px 15px; border-radius: 5px; font-weight: bold;
            display: none; cursor: pointer; 
            animation: pulse 2s infinite; /* Výstražné pulzování přitahující pozornost */
        }
        .reset-btn:hover { background-color: #bb2d3b; }
        
        @keyframes pulse {
            0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); }
        }
        
        /* Drobný nadpis indikující aktuální úroveň menu */
        .mode-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 2px; }
    </style>
</head>
<body>
    <!-- ========================================== -->
    <!-- STRUKTURA UŽIVATELSKÉHO ROZHRANÍ (DOM)     -->
    <!-- ========================================== -->
    
    <!-- Horní fixní informační panel -->
    <div class="top-bar">
        <div>
            <!-- Indikátor kontextu (hlavní menu vs. podmenu zařízení) -->
            <div id="mode-display" class="mode-label">NAČÍTÁM...</div>

            <div class="msg-container">
                <!-- Oblast pro textové hlášení požadavků (např. "Mám žízeň") -->
                <div id="status-message" style="font-size: 1.4rem; font-weight: bold;">Čekám na data...</div>
                <!-- Skryté deaktivační tlačítko; zviditelní se pouze při aktivním poplachu -->
                <button id="reset-button" class="reset-btn" onclick="resetMsg()">
                    <i class="fa-solid fa-check"></i> VYŘÍZENO
                </button>
            </div>
        </div>
        <!-- Vizuální ukazatel stavu bezdrátové komunikace s hardwarem -->
        <div id="connection-indicator" class="status-badge status-sleep">
            <i class="fa-solid fa-moon"></i> <span>SPÍ</span>
        </div>
    </div>

    <!-- Hlavní kontejner pro dynamické vykreslování položek menu -->
    <div class="container pb-4">
        <!-- Třída 'row' s 'justify-content-center' centruje nevyplněné řádky v mřížce -->
        <div id="menu-container" class="row justify-content-center g-3"></div>
    </div>

    <!-- ========================================== -->
    <!-- APLIKAČNÍ LOGIKA FRONTENDU (JavaScript)    -->
    <!-- ========================================== -->
    <script>
        // --- GLOBÁLNÍ STAVOVÉ PROMĚNNÉ ---
        let lastMenuStr = "";       // Slouží k detekci změn v datové struktuře menu (zabraňuje neustálému překreslování DOMu)
        let lastActionTime = 0;     // Uchovává časové razítko poslední události pro triggrování CSS animací

        /**
         * Hlavní asynchronní smyčka (Polling).
         * Periodicky dotazuje Flask backend (REST API) na aktuální stavový objekt systému.
         */
        function updateStatus() {
            // Parametr 't' (timestamp) na konci URL slouží jako tzv. "Cache-Buster". 
            // Zabraňuje prohlížeči, aby vracel stará nacachovaná data (častý problém při rychlém pollingu).
            fetch('/api/status?t=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    
                    // --- 1. DETEKCE ZMĚN VE STRUKTUŘE MENU ---
                    // Serializace (JSON.stringify) umožňuje porovnat obsah dvou vnořených struktur.
                    const currentMenuStr = JSON.stringify(data.current_menu);
                    if (currentMenuStr !== lastMenuStr) {
                        // K překreslení DOMu dojde pouze v případě, že pacient přepnul obrazovku.
                        renderMenu(data.current_menu);
                        lastMenuStr = currentMenuStr;
                        
                        const modeLabel = document.getElementById('mode-display');
                        
                        // Zjištění kontextu aplikace: Pokud historie není prázdná, uživatel je v hlubokém podmenu.
                        if (data.menu_history && data.menu_history.length > 0) {
                            modeLabel.innerText = "OVLÁDÁNÍ ZAŘÍZENÍ - PODMENU";
                            modeLabel.style.color = "#0dcaf0"; // Azurová barva pro technologický mód
                        } else {
                            // Kontrola nadřazeného režimu ('devices' pro výběr zařízení, 'home' pro základní požadavky)
                            if (data.mode === "devices") {
                                modeLabel.innerText = "VÝBĚR ZAŘÍZENÍ";
                                modeLabel.style.color = "#0dcaf0"; 
                            } else {
                                modeLabel.innerText = "BĚŽNÉ POŽADAVKY";
                                modeLabel.style.color = "#888"; // Šedá barva pro výchozí mód
                            }
                        }
                    }

                    // --- 2. AKTUALIZACE POZICE KURZORU ---
                    // Prochází všechny existující karty v DOMu a aplikuje CSS třídu pouze na aktivní index.
                    document.querySelectorAll('.card').forEach((c, idx) => {
                        if (idx === data.selected_index) {
                            c.classList.add('joystick-active');
                            // AUTOMATICKÉ SCROLLOVÁNÍ: Pokud by karet bylo moc, prohlížeč na ně automaticky sjede
                            c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        } else {
                            c.classList.remove('joystick-active');
                        }
                    });

                    // --- 3. EXEKUCE ZPĚTNÉ VAZBY (Probliknutí) ---
                    // Porovná nové časové razítko s historickým. Pokud je novější, došlo k akci na joysticku.
                    if (data.last_action && data.last_action > lastActionTime) {
                        lastActionTime = data.last_action;
                        const activeCard = document.querySelector('.joystick-active');
                        if (activeCard) {
                            // Tzv. "CSS Reflow Hack": Rychlé odstranění a zpětné přiřazení třídy
                            // včetně asynchronního vynucení přepočtu stylů (offsetWidth) zaručí restart animace.
                            activeCard.classList.remove('flash-animation');
                            void activeCard.offsetWidth; 
                            activeCard.classList.add('flash-animation');
                        }
                    }

                    // --- 4. DELEGACE AKTUALIZACE HLAVIČKY ---
                    updateHeader(data);
                })
                .catch(err => console.error("Chyba synchronizace s backendem (Fetch Error):", err));
        }

        /**
         * Vykreslovací jádro (Render engine) pro dynamický generování položek menu.
         * Využívá ES6 Template Literals pro srozumitelnou integraci proměnných do HTML řetězců.
         * @param {Array} menuItems - Pole objektů reprezentujících jednotlivé karty menu.
         */
        function renderMenu(menuItems) {
            const container = document.getElementById('menu-container');
            container.innerHTML = ""; // Úplné vyčištění stávajícího DOM elementu

            // DYNAMICKÁ MŘÍŽKA: Pokud je v menu více než 6 karet, zmenšíme je, aby se vešly na obrazovku
            const isCompact = menuItems.length > 6;
            
            // Normální režim = 2 sloupce na mobilu, 3 na tabletu, 4 na PC
            // Kompaktní režim = 3 sloupce na mobilu, 4 na tabletu, 6 na PC
            const colClass = isCompact ? "col-4 col-md-3 col-lg-2" : "col-6 col-md-4 col-lg-3";
            const cardClass = isCompact ? "compact-card" : "";

            menuItems.forEach((item, index) => {
                const html = `
                <div class="${colClass}">
                    <div class="card h-100 text-center p-3 text-white ${cardClass}" onclick="manualClick(${index})">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center p-0">
                            <i class="fa-solid ${item.icon} icon-large text-${item.color}"></i>
                            <h4 class="card-title mt-2">${item.label}</h4>
                        </div>
                    </div>
                </div>`;
                container.innerHTML += html; // Vložení nové karty do paměti a na obrazovku
            });
        }

        /**
         * Logická vrstva zpracovávající hlavičku aplikace (upozornění, stavové indikátory).
         * @param {Object} data - Kompletní stavový model deserializovaný z backend API.
         */
        function updateHeader(data) {
            const msgBox = document.getElementById('status-message');
            const resetBtn = document.getElementById('reset-button');
            msgBox.innerText = data.message;
            
            // --- LOGIKA POPLACHŮ ---
            // Filtrace stavů: Zjistíme, zda se jedná o běžnou navigaci (Info) nebo o požadavek pacienta (Poplach).
            const isInfoMessage = data.message.startsWith("Menu:") || 
                                  data.message.startsWith("TV:") || 
                                  data.message.startsWith("KLÍMA:") || 
                                  data.message.startsWith("RÁDIO:") || 
                                  data.message.startsWith("LED:") || 
                                  data.message.startsWith("Režim:") ||
                                  data.message === "Jste v hlavním menu";
            
            // Tlačítko "VYŘÍZENO" se odhalí výhradně tehdy, pokud je aktivní poplach.
            if (data.message !== "Připraveno" && !isInfoMessage) {
                msgBox.style.color = "#ffc107"; // Žlutá barva evokující nutnost pozornosti (Bootstrap Warning)
                resetBtn.style.display = "block";
            } else {
                msgBox.style.color = "white"; // Klidový stav
                resetBtn.style.display = "none";
            }

            // --- LOGIKA INDIKÁTORU PŘIPOJENÍ ---
            const badge = document.getElementById('connection-indicator');
            const icon = badge.querySelector('i');
            const text = badge.querySelector('span');
            
            // Odstranění předchozích stavů (vyčištění tříd)
            badge.classList.remove('status-ready', 'status-sleep', 'status-conn');

            // Vyhodnocení stavového stroje spojení a přiřazení adekvátní grafické vizualizace
            if (data.connection === 'READY') {
                badge.classList.add('status-ready');
                icon.className = 'fa-solid fa-gamepad';
                text.innerText = "AKTIVNÍ";
            } else if (data.connection === 'CONNECTING') {
                badge.classList.add('status-conn');
                icon.className = 'fa-solid fa-spinner fa-spin';
                text.innerText = "PŘIPOJOVÁNÍ";
            } else {
                badge.classList.add('status-sleep');
                icon.className = 'fa-solid fa-moon';
                text.innerText = "SPÍ";
            }
        }

        // ==========================================
        // MANUÁLNÍ OVLÁDÁNÍ (ZÁCHRANNÉ/PEČOVATELSKÉ UI)
        // ==========================================
        // Tyto funkce umožňují interakci s aplikací i bez připojeného hardwarového ovladače (např. přes dotykový displej).
        
        /** Odesílá index karty na backend po kliknutí myší / dotykem. */
        function manualClick(id) { fetch('/api/click/' + id, { method: 'POST' }); }
        
        /** Vynucuje smazání alarmu ošetřujícím personálem. */
        function resetMsg() { fetch('/api/reset', { method: 'POST' }); }

        // ==========================================
        // INICIALIZACE APLIKACE
        // ==========================================
        // Spuštění asynchronní smyčky s intervalem 300 milisekund (cca 3.3 FPS), což představuje optimální 
        // kompromis mezi plynulostí UI a vytížením sítě/procesoru mikropočítače Raspberry Pi.
        setInterval(updateStatus, 300);
    </script>
</body>
</html>
