<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistivní Hub</title>
    
    <!-- ========================================== -->
    <!-- 1. EXTERNÍ KNIHOVNY A FRAMEWORKY (CDN)     -->
    <!-- ========================================== -->
    <!-- Bootstrap 5: CSS framework zajišťující plnou responzivitu (přizpůsobení pro mobily a tablety) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6: Rozsáhlá knihovna vektorových ikon pro srozumitelnou vizuální navigaci pacienta -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ========================================== -->
    <!-- 2. KASKÁDOVÉ STYLY (CSS)                   -->
    <!-- ========================================== -->
    <style>
        /* --- ZÁKLADNÍ VZHLED (Dark Mode Téma) --- */
        body { 
            background-color: #121212; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            overflow-x: hidden; 
            transition: background-color 0.5s ease;
        }

        /* --- KRIZOVÁ SOS ANIMACE --- */
        /* Zajišťuje výrazné blikání celého pozadí webu na červeno pro upoutání pozornosti personálu */
        @keyframes sosBlink {
            0% { background-color: #121212; }
            50% { background-color: #5a0000; } /* Tmavě červená poplachová barva */
            100% { background-color: #121212; }
        }
        .sos-blinking {
            animation: sosBlink 1.5s infinite !important;
        }
        
        /* --- STYLOVÁNÍ NAVIGAČNÍCH KARET --- */
        .card { 
            transition: all 0.2s ease-in-out; 
            cursor: pointer; 
            border: 2px solid #333; 
            background-color: #1e1e1e; 
            border-radius: 15px; 
            min-height: 180px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
        }
        
        /* Zmenšený formát karet pro případ, že menu obsahuje více než 6 položek (např. ovládání TV) */
        .compact-card {
            min-height: 180px !important; 
            padding: 15px !important;
        }
        .compact-card .icon-large {
            font-size: 2.5rem !important; 
            margin-bottom: 8px !important;
        }
        .compact-card .card-title {
            font-size: 1.1rem !important; 
            margin-top: 8px !important;
            margin-bottom: 0 !important;
        }
        
        /* --- VIZUALIZACE AKTIVNÍHO VÝBĚRU (Kurzor) --- */
        /* Zvýrazňuje kartu, na které se aktuálně nachází kurzor ovládaný joystickem */
        .joystick-active { 
            border-color: #00ff00 !important; 
            transform: scale(1.05); 
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4); 
            background-color: #2a2a2a; 
            z-index: 10;
        }

        /* --- ANIMACE POTVRZENÍ AKCE --- */
        /* Krátké probliknutí aktivní karty zelenou barvou při stisku tlačítka / pohybu dolů */
        @keyframes flashConfirm {
            0% { background-color: #2a2a2a; transform: scale(1.05); }
            50% { background-color: #198754; transform: scale(1.15); box-shadow: 0 0 40px #198754; }
            100% { background-color: #2a2a2a; transform: scale(1.05); }
        }
        .flash-animation {
            animation: flashConfirm 0.4s ease-out;
        }
        
        .icon-large { font-size: 3.5rem; margin-bottom: 15px; display: block; }
        
        /* --- HORNÍ INFORMAČNÍ PANEL (Status Bar) --- */
        /* Přilepený k hornímu okraji obrazovky (sticky), neustále viditelný */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: #000; border-bottom: 1px solid #333;
            margin-bottom: 20px; 
            position: sticky; top: 0; z-index: 1000; 
        }
        
        .msg-container { display: flex; align-items: center; gap: 15px; }
        
        /* --- INDIKÁTOR PŘIPOJENÍ BLUETOOTH --- */
        .status-badge {
            font-size: 1rem; padding: 6px 15px; border-radius: 50px; font-weight: bold;
            display: flex; align-items: center; gap: 8px; text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .status-ready { background-color: #198754; color: white; border: 1px solid #198754; }
        .status-sleep { background-color: #212529; color: #6c757d; border: 1px solid #495057; }
        .status-conn { background-color: #ffc107; color: black; border: 1px solid #ffc107; }
        
        /* --- TLAČÍTKO PRO ZRUŠENÍ POPLACHU (VYŘÍZENO) --- */
        .reset-btn {
            background-color: #dc3545; color: white; border: none;
            padding: 5px 15px; border-radius: 5px; font-weight: bold;
            display: none; cursor: pointer; 
            animation: pulse 2s infinite; 
        }
        .reset-btn:hover { background-color: #bb2d3b; }
        
        /* Jemné pulzování varovného tlačítka */
        @keyframes pulse {
            0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); }
        }
        
        .mode-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 2px; }
    </style>
</head>
<body>
    <!-- ========================================== -->
    <!-- 3. STRUKTURA UŽIVATELSKÉHO ROZHRANÍ (DOM)  -->
    <!-- ========================================== -->
    
    <!-- HORNÍ LIŠTA: Zobrazuje zprávy, stav poplachu a systémová tlačítka -->
    <div class="top-bar">
        <div>
            <div id="mode-display" class="mode-label">NAČÍTÁM...</div>
            <div class="msg-container">
                <!-- Box pro zobrazení aktuálního textu (např. MÁM ŽÍZEŇ, PŘIPRAVENO) -->
                <div id="status-message" style="font-size: 1.4rem; font-weight: bold;">Čekám na data...</div>
                <!-- Potvrzovací tlačítko (zobrazí se pouze při aktivním požadavku/poplachu) -->
                <button id="reset-button" class="reset-btn" onclick="resetMsg()">
                    <i class="fa-solid fa-check"></i> VYŘÍZENO
                </button>
            </div>
        </div>
        
        <!-- PRAVÁ STRANA LIŠTY: Systémové ovládání a status hardwaru -->
        <div style="display: flex; gap: 15px; align-items: center;">
            <button class="btn btn-outline-danger btn-sm" onclick="triggerOta()" style="border-radius: 50px; padding: 6px 15px; font-weight: bold; box-shadow: 0 0 10px rgba(0,0,0,0.3);">
                <i class="fa-solid fa-download"></i> AKTUALIZOVAT OVLADAČ
            </button>
            <div id="connection-indicator" class="status-badge status-sleep">
                <i class="fa-solid fa-moon"></i> <span>SPÍ</span>
            </div>
        </div>
    </div>

    <!-- KONTEJNER PRO MENU: Zde JavaScript dynamicky vykresluje jednotlivé karty -->
    <div class="container pb-4">
        <div id="menu-container" class="row justify-content-center g-3"></div>
    </div>

    <!-- ========================================== -->
    <!-- 4. APLIKAČNÍ LOGIKA FRONTENDU (JavaScript) -->
    <!-- ========================================== -->
    <script>
        // Stavové proměnné pro detekci změn (optimalizace vykreslování)
        let lastMenuStr = "";       // Sleduje, zda se změnila struktura menu (např. přechod do podmenu)
        let lastActionTime = 0;     // Sleduje čas poslední akce pro spouštění flash animací

        /**
         * HLAVNÍ SYNCHRONIZAČNÍ SMYČKA (AJAX Polling)
         * Stahuje kompletní stavový model z backendu (web.py) a promítá jej do HTML.
         */
        function updateStatus() {
            // Parametr ?t=... funguje jako tzv. "Cache Buster" a zabraňuje prohlížeči, 
            // aby načítal stará uložená data z paměti. Vynucuje vždy čerstvý dotaz.
            fetch('/api/status?t=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    const currentMenuStr = JSON.stringify(data.current_menu);
                    
                    // --- 1. PŘEKRESLENÍ MENU (Optimalizace) ---
                    // Překreslí karty (DOM) pouze v případě, že se struktura menu opravdu změnila.
                    // Tím se zabraňuje nepříjemnému "problikávání" obrazovky při každém cyklu.
                    if (currentMenuStr !== lastMenuStr) {
                        renderMenu(data.current_menu);
                        lastMenuStr = currentMenuStr;
                        
                        // Aktualizace navigační nápovědy v levém horním rohu
                        const modeLabel = document.getElementById('mode-display');
                        if (data.menu_history && data.menu_history.length > 0) {
                            modeLabel.innerText = "OVLÁDÁNÍ ZAŘÍZENÍ - PODMENU";
                            modeLabel.style.color = "#0dcaf0"; 
                        } else {
                            if (data.mode === "devices") {
                                modeLabel.innerText = "VÝBĚR ZAŘÍZENÍ";
                                modeLabel.style.color = "#0dcaf0"; 
                            } else {
                                modeLabel.innerText = "BĚŽNÉ POŽADAVKY";
                                modeLabel.style.color = "#888"; 
                            }
                        }
                    }

                    // --- 2. VIZUALIZACE KURZORU (Zvýraznění karty) ---
                    // Iteruje přes všechny karty a přidá/odebere CSS třídu aktivnímu prvku
                    document.querySelectorAll('.card').forEach((c, idx) => {
                        if (idx === data.selected_index) {
                            c.classList.add('joystick-active');
                            // Automaticky posune stránku tak, aby byla aktivní karta vždy viditelná (důležité pro dlouhá menu)
                            c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        } else {
                            c.classList.remove('joystick-active');
                        }
                    });

                    // --- 3. ANIMACE POTVRZENÍ AKCE ---
                    // Pokud backend nahlásí novou akci, restartujeme zelenou animaci na vybrané kartě
                    if (data.last_action && data.last_action > lastActionTime) {
                        lastActionTime = data.last_action;
                        const activeCard = document.querySelector('.joystick-active');
                        if (activeCard) {
                            activeCard.classList.remove('flash-animation');
                            void activeCard.offsetWidth; // Tento "hack" vynutí okamžité překreslení prohlížečem
                            activeCard.classList.add('flash-animation');
                        }
                    }

                    // --- 4. ZPRACOVÁNÍ SOS POPLACHU ---
                    // Přidá/odebere CSS třídu na tělo dokumentu pro blikání celé obrazovky
                    if (data.sos_active) {
                        document.body.classList.add('sos-blinking');
                    } else {
                        document.body.classList.remove('sos-blinking');
                    }

                    // Volání pomocné funkce pro aktualizaci horní lišty
                    updateHeader(data);
                })
                .catch(err => console.error("Fetch Error:", err));
        }

        /**
         * FUNKCE PRO VYKRESLENÍ KARET (DOM Manipulace)
         * Vezme pole ze serveru a dynamicky vygeneruje HTML strukturu.
         */
        function renderMenu(menuItems) {
            const container = document.getElementById('menu-container');
            container.innerHTML = ""; // Vymazání starého obsahu

            // Responzivní design: Pokud je položek hodně (např. ovládání TV), použijí se menší sloupce
            const isCompact = menuItems.length > 6;
            const colClass = isCompact ? "col-4 col-md-3 col-lg-2" : "col-6 col-md-4 col-lg-3";
            const cardClass = isCompact ? "compact-card" : "";

            // Vytvoření HTML pro každou jednotlivou kartu
            menuItems.forEach((item, index) => {
                const html = `
                <div class="${colClass}">
                    <div class="card h-100 text-center p-3 text-white ${cardClass}" onclick="manualClick(${index})">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center p-0">
                            <!-- Injekce FontAwesome ikonky a specifické barvy z databáze (web.py) -->
                            <i class="fa-solid ${item.icon} icon-large text-${item.color}"></i>
                            <h4 class="card-title mt-2">${item.label}</h4>
                        </div>
                    </div>
                </div>`;
                container.innerHTML += html; 
            });
        }

        /**
         * FUNKCE PRO AKTUALIZACI HORNÍ LIŠTY (Status Bar)
         */
        function updateHeader(data) {
            const msgBox = document.getElementById('status-message');
            const resetBtn = document.getElementById('reset-button');
            msgBox.innerText = data.message;
            
            // Ochrana, aby se červené tlačítko "VYŘÍZENO" nezobrazovalo u běžných stavových hlášek,
            // ale pouze ve chvíli, kdy pacient skutečně žádá o asistenci (Žízeň, Pomoc atd.)
            const isInfoMessage = data.message.startsWith("Menu:") || 
                                  data.message.startsWith("TV:") || 
                                  data.message.startsWith("KLÍMA:") || 
                                  data.message.startsWith("RÁDIO:") || 
                                  data.message.startsWith("LED:") || 
                                  data.message.startsWith("Režim:") ||
                                  data.message.startsWith("Povel k aktualizaci") ||
                                  data.message === "Jste v hlavním menu" ||
                                  data.message === "Připraveno";
            
            if (!isInfoMessage) {
                msgBox.style.color = "#ffc107"; // Žlutá barva pro nevyřízené požadavky
                resetBtn.style.display = "block";
            } else {
                msgBox.style.color = "white"; 
                resetBtn.style.display = "none";
            }

            // Aktualizace indikátoru připojení k ESP32 ovladači
            const badge = document.getElementById('connection-indicator');
            const icon = badge.querySelector('i');
            const text = badge.querySelector('span');
            
            badge.classList.remove('status-ready', 'status-sleep', 'status-conn');

            if (data.connection === 'READY') {
                badge.classList.add('status-ready');
                icon.className = 'fa-solid fa-gamepad';
                text.innerText = "AKTIVNÍ";
            } else if (data.connection === 'CONNECTING') {
                badge.classList.add('status-conn');
                icon.className = 'fa-solid fa-spinner fa-spin';
                text.innerText = "PŘIPOJOVÁNÍ";
            } else {
                badge.classList.add('status-sleep');
                icon.className = 'fa-solid fa-moon';
                text.innerText = "SPÍ";
            }
        }
        
        // --- POMOCNÉ FUNKCE PRO VOLÁNÍ API Z WEBU ---
        // Umožňuje ošetřovateli vybírat položky v menu i ručním kliknutím myší/dotykem
        function manualClick(id) { fetch('/api/click/' + id, { method: 'POST' }); }
        
        // Tlačítko VYŘÍZENO
        function resetMsg() { fetch('/api/reset', { method: 'POST' }); }
        
        // Tlačítko pro spuštění bezdrátové OTA aktualizace z cloudu
        function triggerOta() { fetch('/api/ota', { method: 'POST' }); }
        
        // ==========================================
        // 5. INICIALIZACE APLIKACE
        // ==========================================
        // Spustí synchronizační smyčku každých 300 ms (třikrát za vteřinu)
        // Zajišťuje plynulý chod rozhraní blížící se reálnému času (Real-Time)
        setInterval(updateStatus, 300);
    </script>
</body>
</html>
