<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistivní Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #121212; color: white; 
            font-family: 'Segoe UI', sans-serif; overflow-x: hidden;
        }
        
        .card { 
            transition: all 0.2s ease-in-out; cursor: pointer; border: 2px solid #333; 
            background-color: #1e1e1e; border-radius: 15px; min-height: 180px; 
            display: flex; flex-direction: column; justify-content: center;
        }
        
        .joystick-active { 
            border-color: #00ff00 !important; transform: scale(1.05); 
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4); background-color: #2a2a2a; z-index: 10;
        }

        /* Animace při potvrzení akce (probliknutí) */
        @keyframes flashConfirm {
            0% { background-color: #2a2a2a; transform: scale(1.05); }
            50% { background-color: #198754; transform: scale(1.15); box-shadow: 0 0 40px #198754; }
            100% { background-color: #2a2a2a; transform: scale(1.05); }
        }
        .flash-animation {
            animation: flashConfirm 0.4s ease-out;
        }
        
        .icon-large { font-size: 3.5rem; margin-bottom: 15px; display: block; }
        
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: #000; border-bottom: 1px solid #333;
            margin-bottom: 20px; position: sticky; top: 0; z-index: 1000;
        }
        
        .msg-container { display: flex; align-items: center; gap: 15px; }
        .status-badge {
            font-size: 1rem; padding: 6px 15px; border-radius: 50px; font-weight: bold;
            display: flex; align-items: center; gap: 8px; text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .status-ready { background-color: #198754; color: white; border: 1px solid #198754; }
        .status-sleep { background-color: #212529; color: #6c757d; border: 1px solid #495057; }
        .status-conn { background-color: #ffc107; color: black; border: 1px solid #ffc107; }
        .reset-btn {
            background-color: #dc3545; color: white; border: none;
            padding: 5px 15px; border-radius: 5px; font-weight: bold;
            display: none; cursor: pointer; animation: pulse 2s infinite;
        }
        .reset-btn:hover { background-color: #bb2d3b; }
        @keyframes pulse {
            0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); }
        }
        .mode-label { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 2px; }
        .brand-select { background-color: #333; color: white; border: 1px solid #555; padding: 4px 10px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div>
            <div id="mode-display" class="mode-label">NAČÍTÁM...</div>

            <!-- Výběr značky TV (zobrazí se pouze pokud z Pythonu přijdou data) -->
            {% if brands %}
            <div id="tv-brand-container" style="margin-bottom: 5px;">
                <label for="tvBrand" style="font-size: 0.8rem; color: #888; margin-right: 5px;">TV:</label>
                <select id="tvBrand" class="brand-select" onchange="changeBrand(this.value)">
                    {% for brand in brands %}
                    <option value="{{ brand }}" {% if brand == current_brand %}selected{% endif %}>
                        {{ brand|upper }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <div class="msg-container">
                <div id="status-message" style="font-size: 1.4rem; font-weight: bold;">Čekám na data...</div>
                <button id="reset-button" class="reset-btn" onclick="resetMsg()">
                    <i class="fa-solid fa-check"></i> VYŘÍZENO
                </button>
            </div>
        </div>
        <div id="connection-indicator" class="status-badge status-sleep">
            <i class="fa-solid fa-moon"></i> <span>SPÍ</span>
        </div>
    </div>

    <div class="container">
        <!-- Třída justify-content-center zajistí, že 5 karet bude zarovnaných na střed -->
        <div id="menu-container" class="row justify-content-center g-4"></div>
    </div>

    <script>
        let lastMode = ""; 
        let lastActionTime = 0;

        function updateStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    
                    // 1. ZMĚNA REŽIMU
                    if (data.mode !== lastMode) {
                        renderMenu(data.current_menu);
                        lastMode = data.mode;
                        
                        const modeLabel = document.getElementById('mode-display');
                        const tvContainer = document.getElementById('tv-brand-container');
                        
                        if (data.mode === 'tv') {
                            modeLabel.innerText = "OVLÁDÁNÍ TELEVIZE";
                            modeLabel.style.color = "#0dcaf0"; 
                            if(tvContainer) tvContainer.style.display = "block";
                        } else {
                            modeLabel.innerText = "BĚŽNÉ POŽADAVKY";
                            modeLabel.style.color = "#888"; 
                            if(tvContainer) tvContainer.style.display = "none";
                        }
                    }

                    // 2. ZVÝRAZNĚNÍ KARTY
                    document.querySelectorAll('.card').forEach((c, idx) => {
                        if (idx === data.selected_index) {
                            c.classList.add('joystick-active');
                        } else {
                            c.classList.remove('joystick-active');
                        }
                    });

                    // 3. VIZUÁLNÍ EFEKT (Probliknutí) PŘI AKCI
                    if (data.last_action && data.last_action > lastActionTime) {
                        lastActionTime = data.last_action;
                        const activeCard = document.querySelector('.joystick-active');
                        if (activeCard) {
                            // Trik pro restart CSS animace
                            activeCard.classList.remove('flash-animation');
                            void activeCard.offsetWidth; 
                            activeCard.classList.add('flash-animation');
                        }
                    }

                    // 4. HLAVIČKA
                    updateHeader(data);
                })
                .catch(err => console.error("Chyba:", err));
        }

        // Generování HTML karet z JSON dat z Pythonu
        function renderMenu(menuItems) {
            const container = document.getElementById('menu-container');
            container.innerHTML = ""; 

            menuItems.forEach((item, index) => {
                const html = `
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="card h-100 text-center p-4 text-white" onclick="manualClick(${index})">
                        <div class="card-body">
                            <i class="fa-solid ${item.icon} icon-large text-${item.color}"></i>
                            <h4 class="card-title mt-3">${item.label}</h4>
                        </div>
                    </div>
                </div>`;
                container.innerHTML += html;
            });
        }

        function updateHeader(data) {
            const msgBox = document.getElementById('status-message');
            const resetBtn = document.getElementById('reset-button');
            msgBox.innerText = data.message;
            
            const isInfoMessage = data.message.startsWith("Režim:") || 
                                  data.message.startsWith("TV:");
            
            if (data.message !== "Připraveno" && !isInfoMessage) {
                msgBox.style.color = "#ffc107";
                resetBtn.style.display = "block";
            } else {
                msgBox.style.color = "white";
                resetBtn.style.display = "none";
            }

            const badge = document.getElementById('connection-indicator');
            const icon = badge.querySelector('i');
            const text = badge.querySelector('span');
            
            badge.classList.remove('status-ready', 'status-sleep', 'status-conn');

            if (data.connection === 'READY') {
                badge.classList.add('status-ready');
                icon.className = 'fa-solid fa-gamepad';
                text.innerText = "AKTIVNÍ";
            } else if (data.connection === 'CONNECTING') {
                badge.classList.add('status-conn');
                icon.className = 'fa-solid fa-spinner fa-spin';
                text.innerText = "PŘIPOJOVÁNÍ";
            } else {
                badge.classList.add('status-sleep');
                icon.className = 'fa-solid fa-moon';
                text.innerText = "SPÍ";
            }
        }

        // Pomocné funkce pro posílání kliknutí myší
        function manualClick(id) { fetch('/api/click/' + id, { method: 'POST' }); }
        function resetMsg() { fetch('/api/reset', { method: 'POST' }); }
        function changeBrand(brand) { fetch('/api/set_brand/' + brand, { method: 'POST' }); }

        // Volání smyčky
        setInterval(updateStatus, 300);
    </script>
</body>
</html>
